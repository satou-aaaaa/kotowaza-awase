<style>
/* 和紙と墨と朱：生成りの地に、短冊（ことわざ）を書く */
:root{

html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(#00000008 1px,transparent 1px);background-size:6px 6px;color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:700;font-size:20px;margin:0;letter-spacing:.04em}

.dots{display:flex;gap:6px;flex:1;max-width:140px}
.dots i{flex:1;height:6px;border-radius:3px;background:transparent;border:1px solid var(--ink2);box-sizing:border-box}
.dots i.on{background:var(--shu);border-color:var(--shu);height:10px;margin-top:-2px}.dots i.done{background:var(--ink2)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;background:var(--shu);color:#fff;font-weight:700;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--shu2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--ai);box-shadow:0 4px 0 #12304d}
button.main small{font-weight:500;font-size:13px}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:12px;border:1px solid var(--ink2);background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{color:var(--ink2);border-style:dashed;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.7;margin:0;text-align:center}
.note a,.link{color:var(--ai);display:inline-flex;align-items:center;min-height:44px}

.tanzaku{position:relative;background:var(--paper);border:1px solid #2b24201f;border-radius:6px;padding:22px 16px 18px;box-shadow:0 8px 22px #5e524826, inset 0 0 0 6px #efe4cf;text-align:center}
.tanzaku::before{content:"";position:absolute;left:50%;top:-10px;width:10px;height:18px;margin-left:-5px;border-radius:5px;background:var(--shu)}
.prov{font-family:var(--f-brush);font-weight:800;font-size:28px;line-height:1.7;letter-spacing:.06em;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.prov .blank{display:inline-block;min-width:2.2em;padding:0 .25em;margin:0 .1em;border:2px dashed var(--shu);border-radius:6px;color:var(--shu);line-height:1.35;vertical-align:baseline}
.prov .blank.filled{border-style:solid;background:#a8321a14}
.yomi{font-size:13px;color:var(--ink2);margin:4px 0 0;letter-spacing:.05em}
.mean{background:var(--paper);border-left:5px solid var(--ai);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.7;margin:0;text-align:left}
.mean b{color:var(--ai);font-size:13px;display:block}
.ask{display:flex;gap:8px}

.ask input:focus{border-color:var(--ai);outline:none}
.ask button{flex:0 0 auto;min-width:96px}
.hintline{font-size:15px;text-align:center;margin:0;background:var(--paper2);border-radius:10px;padding:8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{all:unset;box-sizing:border-box;cursor:pointer;min-height:56px;border-radius:12px;border:2px solid var(--ink2);background:var(--paper);display:flex;align-items:center;justify-content:center;font:800 20px var(--f-brush);text-align:center;padding:4px}

.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 16px #5e524826;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:21px;font-weight:700;color:var(--ok)}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}

.sim{font-size:14px;line-height:1.7;margin:0;text-align:left;color:var(--ink)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--ink2);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--ink2);vertical-align:middle}
/* ホーム */
.title{font-family:var(--f-brush);font-weight:800;font-size:38px;letter-spacing:.12em;text-align:center;margin:6px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--ai);margin:0}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--ink2);background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:700;font-size:22px;text-align:center;margin:0}
.res{display:flex;flex-direction:column;gap:6px}
.res div,.res button{all:unset;box-sizing:border-box;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;min-height:48px}
.res button{cursor:pointer;width:100%}
.res .no{color:var(--ink2);border-style:dashed}
.res small{color:var(--ink2);font-size:12px;display:block}
.find{box-sizing:border-box;width:100%;min-height:48px;font:inherit;font-size:17px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{min-height:60px;flex-direction:column}
.cats button small{font-size:12px;color:var(--ink2);font-weight:500}
dialog{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--ai);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0006;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.achs{display:flex;flex-direction:column;gap:8px}
.achs div{background:var(--paper);border:1px dashed var(--ink2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.achs div.got{border:2px solid var(--gold)}
.achs b{font-size:15px}.achs div.got b{color:var(--gold)}
.achs small{font-size:12px;color:var(--ink2)}
.achs i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ai) var(--p),#d9ccb6 var(--p))}
.newach{border:2px solid var(--gold);background:var(--paper);font-weight:700;border-radius:12px;padding:12px;text-align:center;font-size:15px;line-height:1.6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--ink2);font-weight:500}
.cal span,.cal button{all:unset;box-sizing:border-box;min-height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.1;background:var(--paper);border:1px solid var(--line)}
.cal .d{border:2px solid var(--shu);font-weight:700}
.cal .a{border:2px dashed var(--ai)}
.cal button{cursor:pointer;border:2px dotted var(--ai);color:var(--ai);font-weight:700}
.cal .em{background:transparent;border:none}
.cal .today{box-shadow:0 0 0 2px var(--ink) inset}
[hidden]{display:none!important}
html.a11y-cvd{--shu:#b0410a;--ai:#005a9c}

:is(button,a,input):focus-visible{outline:3px solid var(--ai)!important;outline-offset:2px!important}

    else if (mode === "p") list = G.practiceList(Math.random, opt || "", s.seen, 10);
    else if (mode === "r") list = dueRev(s).slice(0, 10);
    else { const last = s.runs.e && s.runs.e.list ? s.runs.e.list[s.runs.e.res.length - 1] : s.elast; if (s.runs.e && s.runs.e.res && s.runs.e.res.length < s.runs.e.list.length) return; list = G.endlessList(Math.random, last); }
    if (!list.length) { ok = false; return; }
    s.runs[key] = { mode, date: mode === "a" ? opt : k, list, res: [], cur: null, id: Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36), cat: opt || "", n1: 0 };
  });
  if (!ok) return mode === "a" ? cal() : home();
  play(key);
}

// ---- 遊ぶ画面 ----
// cur：{ key, i, id, x（問題）, m（まちがい）, h（ヒントの段 0〜2）, gone（消した選び肢）, done }
let cur = null;
function play(key) {
  const s = load(), run = s.runs[key];
  if (!run) return home();
  const i = run.res.length;
  if (run.mode !== "e" && i >= run.list.length) return finish(key);
  if (run.mode === "e" && i >= run.list.length - 1) { save((s2) => { const r = s2.runs.e; if (r && r.id === run.id) r.list = r.list.concat(G.endlessList(Math.random, r.list[r.list.length - 1])); }); return play(key); }
  const x = BY.get(run.list[i]);
  if (!x) { toast("問題を読めませんでした"); return home(); }
  const sv = run.cur && run.cur.i === i ? run.cur : null;
  cur = { key, mode: run.mode, i, rid: run.id, x, m: sv ? +sv.m || 0 : 0, h: sv ? Math.min(2, +sv.h || 0) : 0, gone: sv && Array.isArray(sv.gone) ? sv.gone.filter((w) => typeof w === "string") : [], done: false, hard: run.mode === "h" };
  const n = run.mode === "e" ? `${i + 1}問目・一度で ${run.n1 || 0}` : `${i + 1}/${run.list.length}`;
  show(`
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      ${run.mode === "e" ? "" : `<div class="dots" aria-label="${i + 1}問目／${run.list.length}問">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div>`}
      <span style="font-size:13px;color:var(--ink2)">${MODES[run.mode]} ${n}</span></header>
    <div class="tanzaku"><p class="prov" id="prov" data-a11y-say>${provHtml(x)}</p><p class="yomi">${esc(G.CATS[x.cat])}のことわざ・${["", "やさしい", "ふつう", "むずかしい"][x.lv]}</p></div>
    <p class="mean" data-a11y-say><b>意味</b>${esc(x.mean)}</p>
    <p class="hintline" id="hl" hidden></p>
    <form class="ask" id="ask" autocomplete="off"><input id="in" type="text" inputmode="text" enterkeyhint="done" aria-label="欠けた言葉" placeholder="欠けた言葉を入れる" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="main" id="go" type="submit">こたえる</button></form>
    <div class="choice" id="ch" hidden></div>
    <div class="status"><span id="st"></span>${cur.hard ? `<span>上級はヒントなし</span>` : `<button class="sub" id="hint" type="button" style="min-height:44px">ヒント</button>`}</div>
    ${run.mode === "e" ? `<button class="sub" id="quit">ここで降りる</button>` : ""}
    <div id="after"></div>
    ${footer()}`);
  $("back").onclick = home;
  // 変換中の Enter では送らない（IME。Chrome の手引き）
  $("in").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });
  $("ask").onsubmit = (e) => { e.preventDefault(); if (!(e.isComposing)) answer($("in").value); };
  if ($("hint")) $("hint").onclick = hint;
  if ($("quit")) $("quit").onclick = () => finish("e");
  paint();
}
function paint() {
  const x = cur.x, choiceOn = cur.h >= 2 || cur.m >= 3;
  $("st").textContent = cur.done ? "" : `まちがい ${cur.m}・ヒント ${cur.h}`;
  $("hl").hidden = cur.done || cur.h < 1;
  if (cur.h >= 1) $("hl").textContent = `ヒント：${G.hint1(x)}`;
  $("ch").hidden = !choiceOn || cur.done;
  if (choiceOn && !cur.done) {
    $("ch").innerHTML = G.choices(x).map((w) => { const no = cur.gone.includes(w); return `<button type="button" data-w="${esc(w)}" class="${no ? "no" : ""}"${no ? ` aria-label="${esc(w)}（ちがう）" aria-disabled="true"` : ""}>${no ? "✕ " : ""}${esc(w)}</button>`; }).join("");
    $("ch").querySelectorAll("button").forEach((b) => (b.onclick = () => { if (!b.classList.contains("no")) answer(b.dataset.w, true); }));
  }
  if ($("hint")) { $("hint").hidden = cur.done; $("hint").disabled = cur.done || cur.h >= 2; $("hint").textContent = cur.h ? `ヒント（あと${2 - cur.h}）` : "ヒント"; }
}
const same = (r) => r && cur && r.id === cur.rid && r.res.length === cur.i;
// 途中の保存：同じ問題なら、まちがい・ヒントの数は別のタブの分より減らさない
function keep() { save((s) => { const r = s.runs[cur.key]; if (!same(r)) return; const o = r.cur && r.cur.i === cur.i ? r.cur : null; if (o) { cur.m = Math.max(cur.m, +o.m || 0); cur.h = Math.max(cur.h, Math.min(2, +o.h || 0)); for (const w of o.gone || []) if (!cur.gone.includes(w)) cur.gone.push(w); } r.cur = { i: cur.i, m: cur.m, h: cur.h, gone: cur.gone }; }); }
function hint() {
  if (cur.done || cur.hard || cur.h >= 2) return;
  cur.h++; keep(); paint();
  say(cur.h === 1 ? `ヒント：${G.hint1(cur.x)}` : "4つの中から選べます");
  if (cur.h === 2) later(() => { const b = $("ch").querySelector("button:not(.no)"); if (b) b.focus(); }, 30);
}
function answer(v, picked) {
  if (cur.done) return;
  if (!String(v).trim()) return toast("言葉を入れてください");
  if (!same(load().runs[cur.key])) { toast("別の画面で先に進んでいます"); return play(cur.key); }
  if (!G.check(cur.x, v)) {
    cur.m++; if (picked && !cur.gone.includes(v)) cur.gone.push(v);
    keep(); buzz(30); paint();
    $("in").value = "";
    return toast(cur.m >= 3 && cur.h < 2 ? "✕ ちがいます。4つの中から選べます" : "✕ ちがいます。もう一度");

}
function deliver() {
  const x = cur.x, run0 = load().runs[cur.key];
  if (!same(run0)) { toast("別の画面で先に進んでいます"); return play(cur.key); }
  cur.done = true; buzz([10, 40, 10]);
  const rec = { m: cur.m, h: cur.h };
  let saved = false, fin = false;
  save((s) => {
    const r = s.runs[cur.key]; if (!same(r)) return; saved = true;
    if (r.cur && r.cur.i === cur.i) { rec.m = Math.max(rec.m, +r.cur.m || 0); rec.h = Math.max(rec.h, Math.min(2, +r.cur.h || 0)); }
    r.res.push(rec); r.cur = null;
    s.seen[x.id] = (+s.seen[x.id] || 0) + 1;
    if (one(rec)) s.one[x.id] = (+s.one[x.id] || 0) + 1;
    // おさらい：まちがえた・ヒントを使った問題は次の日に。おさらいで一度で解けたら卒業
    if (r.mode === "r") { if (one(rec)) { delete s.rev[x.id]; s.revok++; } else s.rev[x.id] = addDay(todayKey(), 1); }
    else if (!one(rec)) s.rev[x.id] = addDay(todayKey(), 1);
    if (r.mode === "e") { if (one(rec)) r.n1 = (r.n1 || 0) + 1; s.ebest = Math.max(s.ebest, r.n1 || 0); s.elast = x.id; }

  });
  if (!saved) { cur.done = false; toast("別の画面で先に進んでいます"); return play(cur.key); }
  const st = G.starsOf(rec), sim = G.similar(x);
  $("prov").innerHTML = provHtml(x, x.word);
  paint();
  $("ask").hidden = true;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd" data-a11y-say>✓ 正解 ${starStr(st)}</div>
    <p class="prov" style="font-size:24px">${esc(G.full(x))}</p>
    <p class="yomi">${esc(x.yomi)}</p>
    <p class="sim"><b>意味：</b>${esc(x.mean)}</p>
    ${sim.length ? `<p class="sim"><b>にた意味：</b>${sim.map(esc).join("・")}</p>` : ""}
    <p class="note">${rec.m || rec.h ? `まちがい${rec.m}・ヒント${rec.h}。この問題は、あしたの「おさらい」にも出ます。` : "まちがいもヒントもなしで解けました。"}</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次のことわざへ"}</button></div>`;
  say(`正解。${G.full(x)}。${x.mean}`);
  $("next").onclick = () => play(cur.key);
  later(() => { if ($("next")) { $("next").focus({ preventScroll: true }); $("next").scrollIntoView({ behavior: document.documentElement.classList.contains("a11y-calm") ? "auto" : "smooth", block: "nearest" }); } }, 60);
}
function finish(key) {
  const s0 = load(), run = s0.runs[key];
  if (!run) return home();
  let first = false, got = [];
  const rec = { r: run.res.map((r) => ({ m: r.m, h: r.h })) };
  save((s) => {
    const book = run.mode === "d" ? s.days : run.mode === "h" ? s.hdays : run.mode === "a" ? s.late : null;
    if (book && !book[run.date] && run.res.length >= run.list.length) { book[run.date] = rec; first = true; }
    const seen = s.ach || {}; got = achDone(s).filter((n) => !seen[n]); got.forEach((n) => { seen[n] = 1; }); s.ach = seen;
    const c = s.runs[key]; if (c && c.id === run.id) delete s.runs[key];
    if (run.id) s.ended = (s.ended || []).concat(run.id).slice(-40);
  });
  result(run.mode, run.date, first, rec, got, run);
}
// 共有の文：答え（ことわざ）は出さない。🟩★3・🟨★2・🟧★1
const sq = (r) => ["", "🟧", "🟨", "🟩"][G.starsOf(r)];
function shareText(mode, k, rec) { return `ことわざあわせ${mode === "h" ? " 上級" : ""} #${G.dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")}${rec.r.every(one) ? " 全部一度で" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, fresh, run) {
  const s = load();
  const rec = mode === "d" ? s.days[k] || prec : mode === "h" ? s.hdays[k] || prec : prec;
  if (!rec || !okRec(rec)) return home();
  const list = run ? run.list.slice(0, rec.r.length) : listOf(mode, k), all = rec.r.length > 0 && rec.r.every(one), daily = mode === "d" || mode === "h";
  const text = shareText(mode, k, rec), na = nextAch(s);
  const showKofi = first && daily && all && rec.r.length >= list.length && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  const n1 = rec.r.filter(one).length;
  show(`
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>ことわざあわせ<small>${MODES[mode]}${daily || mode === "a" ? ` #${G.dayNo(k)}` : ""}</small></h1><span></span></header>
    <p class="big" data-a11y-say>${mode === "e" ? `${rec.r.length}問解いた（一度で ${n1}問）` : all ? "全部、一度で解けた！" : `${rec.r.length}問 解けた`}</p>
    ${mode === "e" ? `<p class="note">とことんの最高：一度で ${s.ebest}問${n1 && n1 >= s.ebest ? "（自己ベスト）" : ""}。まちがい ${rec.r.reduce((a, r) => a + r.m, 0)}・ヒント ${rec.r.reduce((a, r) => a + r.h, 0)}</p>` : ""}
    ${fresh && fresh.length ? `<div class="newach">🏅 新しい実績：${fresh.map(esc).join("・")}</div>` : na ? `<p class="note">🎯 次の実績「${esc(na.name)}」まで あと${na.goal - na.cur}</p>` : ""}
    <div class="res">${list.map((id, j) => { const x = BY.get(id), r = rec.r[j]; return r ? `<div><span>${esc(G.full(x))}<small>${esc(x.mean)}</small></span>${starStr(G.starsOf(r))}</div>` : ""; }).join("")}</div>
    ${daily ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩一度で　🟨まちがい・ヒント1回　🟧2回以上<br>次の5問まで あと <b>${untilNext()}</b></p>` : ""}
    <button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（最高 ${s.ebest}）` : ""}</button>
    <div class="row">${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="sub" id="go-h">上級に挑む</button>` : ""}<button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">ことわざ帳</button></div>
    ${showKofi ? `<p class="note">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    ${footer()}`);
  $("back").onclick = home;
  $("go-e").onclick = () => startRun("e");
  $("go-p").onclick = mode === "p" && run ? () => startRun("p", run.cat) : practiceMenu;
  $("go-dex").onclick = () => dex();
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());

    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

// ---- 実績・ことわざ帳・カレンダー ----
function ach() {
  const L = achList(load());
  show(`<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${L.filter((a) => a.done).length}/${L.length}</small></h1><span></span></header>
    <p class="note" data-a11y-say>取った実績は ★、まだの実績は ☆ と進み具合です。</p>
    <div class="achs">${L.map((a) => `<div class="${a.done ? "got" : ""}"><b>${a.done ? "★" : "☆"} ${esc(a.name)}</b><small>${esc(a.desc)}</small>${a.done ? "" : `<i style="--p:${Math.round((a.cur / a.goal) * 100)}%"></i><small>いま ${a.cur}/${a.goal}</small>`}</div>`).join("")}</div>
    ${footer()}`);
  $("back").onclick = home;
}
function dex(cat) {
  const s = load(), met = metSet(s), c = cat || "a";
  const fs = [...new Set(G.LIST.filter((x) => x.cat === c).map(G.full))];
  const byF = (f) => G.LIST.find((x) => G.full(x) === f);
  const cnt = (k2) => { const L = [...new Set(G.LIST.filter((x) => x.cat === k2).map(G.full))]; return `${L.filter((f) => met.has(f)).length}/${L.length}`; };
  const row = (f) => `<div><span>${esc(f)}<small>${esc(byF(f).mean)}</small></span></div>`;
  const list = () => fs.map((f) => met.has(f) ? row(f) : `<div class="no"><span>？？？（まだ）<small>${esc(G.CATS[c])}のことわざ</small></span></div>`).join("");
  show(`<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>ことわざ帳<small>出会った ${met.size}/${G.PROVERBS.length}</small></h1><span></span></header>
    <p class="note" data-a11y-say>出会ったことわざと意味です。まだのものは「？」です。言葉・読み・意味でさがせます。</p>
    <input id="q" type="search" class="find" placeholder="さがす（例：ねこ・急ぐ）" aria-label="出会ったことわざを、言葉・読み・意味でさがす" autocomplete="off">
    <p class="note" id="qn" role="status"></p>
    <div class="cats" id="cats">${Object.entries(G.CATS).map(([k2, n]) => `<button class="sub" data-c="${k2}" aria-pressed="${k2 === c}" style="min-height:48px${k2 === c ? ";border:2px solid var(--shu)" : ""}">${k2 === c ? "● " : ""}${esc(n)}<small>${cnt(k2)}</small></button>`).join("")}</div>
    <div class="res" id="dexres">${list()}</div>
    ${footer()}`);
  $("back").onclick = home;
  document.querySelectorAll(".cats button").forEach((b) => (b.onclick = () => dex(b.dataset.c)));
  // さがす：出会ったことわざだけから（まだのものは名前を出さない）。読みのゆれ（カタカナ・空白）は kana でそろえる
  $("q").oninput = () => {
    const w = G.kana($("q").value.trim());
    $("cats").hidden = !!w;
    if (!w) { $("qn").textContent = ""; $("dexres").innerHTML = list(); return; }

}
function cal(ym) {

  const prev = new Date(Date.UTC(+y.slice(0, 4), +y.slice(5, 7) - 2, 1)).toISOString().slice(0, 7), next = new Date(Date.UTC(+y.slice(0, 4), +y.slice(5, 7), 1)).toISOString().slice(0, 7);

  for (let i = 0; i < dow; i++) cells.push(`<span class="em"></span>`);
  for (let d = 1; d <= days; d++) {

    <div class="cal">${"日月火水木金土".split("").map((w) => `<b>${w}</b>`).join("")}${cells.join("")}</div>
    <p class="note">遊んだ日 合わせて ${playedDays(s)}日${streak(s.days) >= 1 ? `・今日の5問 ${streak(s.days)}日続けて` : ""}</p>

  $("nm").onclick = () => cal(next);
  document.querySelectorAll(".cal button").forEach((b) => (b.onclick = () => startRun("a", b.dataset.k)));
}

window.__kw = { G, load, save, achList, nextAch, lateDays, dueRev, todayKey, prevDay, shareText, streak, cur: () => cur, answer: (v, p) => answer(v, p), hint: () => hint(), play: (k) => play(k), home: () => home(), startRun: (m, o) => startRun(m, o) };
